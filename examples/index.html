<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Example app for navigation-controller"
    />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link rel="manifest" href="manifest.json" />
    <title>navigation-controller example</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      cordova.js is injected by the Cordova platform at runtime and is not
      present when running in a plain browser, so the 404 in dev is expected.
      Kept as an absolute path so Vite emits it verbatim instead of trying to
      bundle it.
    -->
    <script type="text/javascript" src="/cordova.js"></script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
