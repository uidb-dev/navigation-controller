version: 2

# Both manifests are grouped into a single PR each, so a burst of transitive
# advisories arrives as one reviewable update instead of the ~20 stale PRs that
# had accumulated here before.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tsup bundles rollup-plugin-dts against typescript 5. On typescript 7 the
      # dts step dies with "Cannot read properties of undefined (reading
      # 'useCaseSensitiveFileNames')" and the build emits NO .d.ts at all, while
      # still passing tsc, vitest and the JS build -- so it fails silently in
      # exactly the way a green PR hides. Revisit when tsup supports typescript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      root-build-toolchain:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /examples
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      example-app:
        patterns:
          - "*"
